[project]
name = "kokanee-tools"
version = "0.1.0"
description = "Terrain, basemap and route tooling for the Kokanee Glacier 3D ski topo"
requires-python = "==3.12.*"
dependencies = [
  "rasterio>=1.4,<1.6",
  "numpy>=2.0,<3",
  "pyproj>=3.7,<4",
  "pystac-client>=0.8,<1",
  "shapely>=2.0,<3",
  "pillow>=11,<13",
  "scipy>=1.13,<2",
  "requests>=2.32,<3",
]

[tool.uv]
package = false
